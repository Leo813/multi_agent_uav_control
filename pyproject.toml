[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-uav-control"
version = "0.1.0"
description = "Independent PPO and MAPPO research for quadcopter control with Isaac Lab."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/Leo813/multi_agent_uav_control"

[tool.setuptools.packages.find]
where = ["."]
include = ["uav_control", "uav_control.*"]
namespaces = false
